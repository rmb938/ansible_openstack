- name: SYNC CREDENTIAL
  ansible.posix.synchronize:
    src: /etc/keystone/credential-keys/
    dest: /etc/keystone/credential-keys/
    set_remote_user: false
    rsync_path: /usr/bin/rsync
    delete: true
  become: true
  become_user: keystone
  when: inventory_hostname != groups['keystone'][0]
  delegate_to: "{{ groups['keystone'][0] }}"

- name: Bootstrap keystone admin and endpoints
  ansible.builtin.command:
    # TODO: randomize this password
    cmd: >-
      /usr/bin/keystone-manage bootstrap --bootstrap-password admin-asdasd
      --bootstrap-admin-url https://openstack-keystone.service.consul:5200/v3/
      --bootstrap-internal-url https://openstack-keystone.service.consul:5200/v3/
      --bootstrap-public-url https://openstack-keystone.haproxy.us-homelab1.hl.rmb938.me/v3/
      --bootstrap-region-id us-homelab1
  become: true
  become_user: keystone
  run_once: true
  delegate_to: "{{ groups['keystone'][0] }}"
  changed_when: false

- name: Create Identity Domain for x509
  openstack.cloud.identity_domain:
    auth:
      auth_url: https://openstack-keystone.haproxy.us-homelab1.hl.rmb938.me/v3/
      username: admin
      password: admin-asdasd
      project_name: admin
      user_domain_name: Default
      project_domain_name: Default
    interface: public
    name: "Keystone Internal X509"
    region_name: "us-homelab1"
    state: present
  run_once: true
  delegate_to: "{{ groups['keystone'][0] }}"
  register: identity_domain_x509

- name: Create Identity Provider for x509
  openstack.cloud.federation_idp:
    auth:
      auth_url: https://openstack-keystone.haproxy.us-homelab1.hl.rmb938.me/v3/
      username: admin
      password: admin-asdasd
      project_name: admin
      user_domain_name: Default
      project_domain_name: Default
    interface: public
    id: "{{ ('CN=' + item.subject.commonName) | hash('sha256') }}"
    domain_id: "{{ identity_domain_x509.domain.id }}"
    description: "Keystone Internal X509 - CN={{ item.subject.commonName }}"
    enabled: true
    region_name: "us-homelab1"
    state: present
  run_once: true
  delegate_to: "{{ groups['keystone'][0] }}"
  loop: "{{ keystone_internal_pki_cert_info.results }}"
  register: identity_provider_x509

- name: Create Identity Mapping for x509
  openstack.cloud.federation_mapping:
    auth:
      auth_url: https://openstack-keystone.haproxy.us-homelab1.hl.rmb938.me/v3/
      username: admin
      password: admin-asdasd
      project_name: admin
      user_domain_name: Default
      project_domain_name: Default
    id: keystone-internal-x509
    rules:
      - local:
          - user:
              name: '{0}'
              type: ephemeral
          - group:
              domain:
                name: Default
              name: '{0}'
        remote:
          - type: SSL_CLIENT_S_DN_CN
          # TODO: need to test this, don't have a cert with OU currently
          # - type: SSL_CLIENT_S_DN_OU
  run_once: true
  delegate_to: "{{ groups['keystone'][0] }}"
  register: identity_mapping_x509

- name: Create Identity Mapping Protocol for x509
  openstack.cloud.keystone_federation_protocol:
    auth:
      auth_url: https://openstack-keystone.haproxy.us-homelab1.hl.rmb938.me/v3/
      username: admin
      password: admin-asdasd
      project_name: admin
      user_domain_name: Default
      project_domain_name: Default
    id: x509
    idp: "{{ item.identity_provider.id }}"
    mapping: "{{ identity_mapping_x509.mapping.id }}"
    region_name: "us-homelab1"
  run_once: true
  delegate_to: "{{ groups['keystone'][0] }}"
  loop: "{{ identity_provider_x509.results }}"

- name: Create Openstack Admin Group
  openstack.cloud.identity_group:
    auth:
      auth_url: https://openstack-keystone.haproxy.us-homelab1.hl.rmb938.me/v3/
      username: admin
      password: admin-asdasd
      project_name: admin
      user_domain_name: Default
      project_domain_name: Default
    name: admin
    description: "OpenStack Admin"
    domain_id: default
    region_name: "us-homelab1"
    state: present
  run_once: true
  delegate_to: "{{ groups['keystone'][0] }}"

- name: Create Openstack Admin Role Assigment Project
  openstack.cloud.role_assignment:
    auth:
      auth_url: https://openstack-keystone.haproxy.us-homelab1.hl.rmb938.me/v3/
      username: admin
      password: admin-asdasd
      project_name: admin
      user_domain_name: Default
      project_domain_name: Default
    role: admin
    group: admin
    project: admin
    region_name: "us-homelab1"
    state: present
  run_once: true
  delegate_to: "{{ groups['keystone'][0] }}"

- name: Create Openstack Admin Role Assigment System All
  openstack.cloud.role_assignment:
    auth:
      auth_url: https://openstack-keystone.haproxy.us-homelab1.hl.rmb938.me/v3/
      username: admin
      password: admin-asdasd
      project_name: admin
      user_domain_name: Default
      project_domain_name: Default
    role: admin
    group: admin
    system: all
    region_name: "us-homelab1"
    state: present
  run_once: true
  delegate_to: "{{ groups['keystone'][0] }}"
