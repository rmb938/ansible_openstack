- name: Create .ssh dir
  ansible.builtin.file:
    path: /var/lib/keystone/.ssh
    state: directory
    owner: keystone
    group: keystone
    mode: "0700"

- name: Create ssh keypair
  community.crypto.openssh_keypair:
    path: /var/lib/keystone/.ssh/id_ecdsa
    owner: keystone
    group: keystone
    mode: "0600"
    type: ed25519
  run_once: true
  delegate_to: "{{ groups['keystone'][0] }}"
  register: ssh_keypair

- name: Place SSH Authorized Keys
  ansible.posix.authorized_key:
    user: keystone
    state: present
    key: "{{ ssh_keypair.public_key }}"
  when: inventory_hostname != groups['keystone'][0]

- name: SYNC FERNET
  ansible.posix.synchronize:
    src: /etc/keystone/fernet-keys/
    dest: /etc/keystone/fernet-keys/
    set_remote_user: false
    rsync_path: /usr/bin/rsync
    delete: true
  become: true
  become_user: keystone
  when: inventory_hostname != groups['keystone'][0]
  delegate_to: "{{ groups['keystone'][0] }}"

