---
- name: Keystone Service Consul Config
  ansible.builtin.template:
    src: etc/consul.d/50_keystone.service.hcl
    dest: /etc/consul.d/50_50_keystone.service.hcl
    mode: "0644"
    owner: consul
    group: consul
  register: keystone_service_consul_config

- name: Restart Consul # noqa: no-handler
  ansible.builtin.systemd_service:
    name: consul
    state: restarted
  when: keystone_service_consul_config.changed

- name: INSTALL KEYSTONE
  ansible.builtin.package:
    name:
      - keystone
      - python3-psycopg
    state: present

- name: Read PKI Data from Vault
  community.hashi_vault.vault_read:
    url: http://127.0.0.1:8100
    path: pki_openstack_keystone_internal_intermediate/issuer/openstack-keystone-internal-intermediate-{{ item }}/json
    auth_method: none
  loop: "{{ range(1) | list }}"
  register: keystone_internal_pki_certs

- name: Cert Info
  community.crypto.x509_certificate_info:
    content: "{{ item.data.data.certificate }}"
  loop: "{{ keystone_internal_pki_certs.results }}"
  register: keystone_internal_pki_cert_info

# Start Consul Template Keystone
- name: Add keystone to sudoers
  community.general.sudoers:
    name: keystone
    user: keystone
    nopassword: true
    validation: required
    commands:
      - /usr/bin/systemctl reload-or-restart apache2
    state: present

- name: Configure Consul Template for Keystone
  ansible.builtin.template:
    src: etc/consul-template/consul-template-keystone.hcl
    dest: /etc/consul-template/consul-template-keystone.hcl
    mode: "0644"
    owner: keystone
    group: keystone
  register: consul_template_keystone_config

- name: Create Consul Template for Keystone Templates directory
  ansible.builtin.file:
    path: /etc/consul-template/templates/keystone/
    state: directory
    mode: "0744"
    owner: keystone
    group: keystone

- name: Place Consul Template for Keystone Templates Files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/consul-template/templates/keystone/{{ item | basename }}"
    mode: "0644"
    owner: keystone
    group: keystone
  with_fileglob:
    - ../files/etc/consul-template/templates/keystone/*.ctmpl
  register: consul_template_keystone_templates_files

- name: Place Consul Template for Keystone Templates Templates
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/consul-template/templates/keystone/{{ item | basename }}"
    mode: "0644"
    owner: keystone
    group: keystone
  with_fileglob:
    - ../templates/etc/consul-template/templates/keystone/*.ctmpl
  register: consul_template_keystone_templates

- name: Consul Template for Keystone SystemD
  ansible.builtin.template:
    src: etc/systemd/system/consul-template-keystone.service
    dest: /etc/systemd/system/consul-template-keystone.service
    mode: "0644"
  register: consul_template_keystone_systemd

- name: Consul Template for Keystone systemd # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: consul_template_keystone_systemd.changed

- name: Start and enable Consul Template for Keystone
  ansible.builtin.systemd:
    name: consul-template-keystone
    state: started
    enabled: true

- name: Restart Consul Template for Keystone if config changed # noqa: no-handler
  ansible.builtin.systemd:
    name: consul-template-keystone
    state: reloaded
  when: consul_template_keystone_templates.changed or
    consul_template_keystone_config.changed or
    consul_template_keystone_templates_files.changed
# End Consul Template Keystone

- name: Remove Listen 80
  ansible.builtin.lineinfile:
    path: /etc/apache2/ports.conf
    regexp: "^Listen 80$"
    state: absent
  register: apache2_ports

- name: Enable Apache2 SSL Mod
  ansible.builtin.command:
    cmd: /usr/sbin/a2enmod ssl
    creates: /etc/apache2/mods-enabled/ssl.load
  register: apache2_ssl_mod

- name: Enable Apache2 Headers Mod
  ansible.builtin.command:
    cmd: /usr/sbin/a2enmod headers
    creates: /etc/apache2/mods-enabled/headers.load
  register: apache2_headers_mod

- name: RESTART APACHE2 # noqa: no-handler
  ansible.builtin.systemd_service:
    name: apache2
    state: restarted
  when: apache2_ports.changed or
    apache2_ssl_mod.changed or
    apache2_headers_mod.changed

- name: Create Apache2 Certificates
  ansible.builtin.command: >-
    step ca certificate {{ ansible_fqdn }}
    /etc/keystone/keystone-public.crt
    /etc/keystone/keystone-public.key
    --ca-url https://step-ca.us-homelab1.hl.rmb938.me:8443
    --root /usr/local/share/ca-certificates/smallstep-homelab-prod.crt
  args:
    creates: "/etc/keystone/keystone-public.crt"

- name: Own Apache2 certificates
  ansible.builtin.file:
    path: /etc/keystone/{{ item }}
    owner: keystone
    group: keystone
    mode: "0600"
  with_items:
    - keystone-public.crt
    - keystone-public.key

- name: Cron to renew Apache2 certificates
  ansible.builtin.cron:
    name: "renew apache2 certificates"
    special_time: "hourly"
    # Rekey needs to happen against the CA, RA's don't support rekey
    # https://smallstep.com/docs/step-ca/registration-authority-ra-mode/#stepcas-limitations
    job: >-
      step ca rekey /etc/keystone/keystone-public.crt
      /etc/keystone/keystone-public.key
      --ca-url https://step-ca.us-homelab1.hl.rmb938.me
      --root /usr/local/share/ca-certificates/smallstep-homelab-prod.crt
      --force --expires-in 720h --exec "systemctl try-reload-or-restart patroni"
    state: present

- name: Place keystone-wsgi-internal
  ansible.builtin.copy:
    src: "usr/local/bin/keystone-wsgi-internal"
    dest: "/usr/local/bin/keystone-wsgi-internal"
    mode: "0755"
    owner: root
    group: root

- name: CONFIGURE APACHE2
  ansible.builtin.template:
    src: etc/apache2/sites-available/keystone.conf
    dest: /etc/apache2/sites-available/keystone.conf
    mode: "0644"
    owner: keystone
    group: keystone
  register: apache2_config

- name: CONFIGURE KEYSTONE
  ansible.builtin.template:
    src: etc/keystone/keystone.conf
    dest: /etc/keystone/keystone.conf
    mode: "0600"
    owner: keystone
    group: keystone
  register: keystone_config
  vars:
    is_internal: false

- name: CONFIGURE KEYSTONE Internal
  ansible.builtin.template:
    src: etc/keystone/keystone.conf
    dest: /etc/keystone/keystone-internal.conf
    mode: "0600"
    owner: keystone
    group: keystone
  register: keystone_internal_config
  vars:
    is_internal: true

- name: RESTART APACHE2 # noqa: no-handler
  ansible.builtin.systemd_service:
    name: apache2
    state: restarted
  when: apache2_config.changed or
    keystone_config.changed or
    keystone_internal_config.changed

- name: FERNET SETUP
  ansible.builtin.command:
    cmd: /usr/bin/keystone-manage fernet_setup --keystone-user keystone --keystone-group keystone
    creates: "/etc/keystone/fernet-keys/0"
  become: true
  become_user: keystone
  run_once: true
  delegate_to: "{{ groups['keystone'][0] }}"

